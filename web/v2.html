<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Infra · v2</title><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/v2.css"></head><body>
<header><h1>Agent Infra <small>v2</small></h1><p>任务、节点与执行证据</p><a href="/">v1 控制台</a></header>
<main><section id="login"><h2>登录</h2><form id="login-form"><label>短期访问凭证<input id="token" type="password" autocomplete="off" required></label><button>连接</button></form><p>凭证只保留在当前页面内存中。</p></section>
<div id="session" hidden><p id="identity"></p><button id="logout">退出</button><button id="refresh">刷新</button>
<section><h2>提交任务</h2><form id="submit-form"><label>Agent 版本<select id="agent"></select></label><label>资源池<select id="pool"></select></label><label>数据路径<select id="data-class"><option value="public">公开数据</option><option value="private">私有固定分析（结果留在节点）</option><option value="edge_summary">边缘批准摘要</option></select></label><label>工作区<select id="workspace"></select></label><label>预算执行<select id="budget-mode"><option value="soft">软预算</option><option value="hard">硬预算（要求有效计费证明）</option></select></label><label>币种<select id="currency"><option>USD</option><option>CNY</option></select></label><label>输入 JSON<textarea id="input">{}</textarea></label><label>Token 预算<input id="tokens" type="number" value="16000" min="1024" max="100000"></label><label>金额上限（所选币种的微单位）<input id="cost" type="number" value="1000000" min="0"></label><button>创建任务</button></form><p>原始数据由节点按工作区 ID 读取，请勿粘贴到任务参数。私有分析仅运行固定程序；边缘动态 Agent 只读取批准摘要。所有真实路径仍须通过宿主机隔离校验。</p></section>
<section><h2>任务</h2><div id="tasks"></div><button id="more">下一页</button></section>
<section id="detail" hidden><h2>任务详情</h2><pre id="snapshot"></pre><button id="cancel">请求取消</button><button id="rerun">按当前表单重新运行</button><button id="delete">删除任务内容</button><h3>事件</h3><pre id="events"></pre><h3>产物</h3><div id="artifacts"></div><h3>费用与未知用量</h3><pre id="usage"></pre></section>
<section id="admin" hidden><h2>管理</h2><details><summary>发布不可变版本</summary><form id="publish-form"><label>类型<select id="publish-kind"><option value="policies">策略</option><option value="agents">Agent</option></select></label><label>名称<input id="publish-name" required pattern="[a-z][a-z0-9_-]*"></label><label>版本定义 JSON<textarea id="publish-body" required>{"version":"1","allowed_pools":["demo"],"tool_kinds":["python"]}</textarea></label><button>发布版本</button></form></details>
<details><summary>节点注册与排空</summary><form id="ticket-form"><label>节点策略 JSON<textarea id="ticket-body">{"pool":"demo","owner":"admin","backend":"demo","slots_limit":1}</textarea></label><button>签发 10 分钟注册票据</button></form><pre id="ticket-result"></pre><div id="nodes"></div></details>
<details><summary>任务证据核对</summary><form id="review-form"><label>结论<select id="review-outcome"><option value="failed">失败</option><option value="cancelled">已取消</option><option value="succeeded">成功</option></select></label><label>停止、清理证据引用<input id="review-evidence" required minlength="10"></label><label><input id="review-confirm" type="checkbox" required> 已独立核实停止、资源回收和未知副作用</label><button>核对当前任务</button></form></details>
<details><summary>未知费用核对</summary><form id="usage-form"><label>请求 ID<input id="usage-id" required></label><label>用量记录版本<input id="usage-version" type="number" min="1" required></label><label>实际 Token<input id="usage-tokens" type="number" min="0" required></label><label>实际费用（微美元）<input id="usage-cost" type="number" min="0" required></label><label>供应商账单证据引用<input id="usage-evidence" minlength="10" required></label><button>追加核对记录</button></form></details><h3>审计</h3><pre id="audit"></pre></section></div><p id="status" role="status" aria-live="polite"></p></main><script src="/v2.js" defer></script></body></html>
