<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Infra · 控制台</title><link rel="stylesheet" href="/app.css"><script src="/app.js" defer></script></head>
<body><header><div><strong>Agent Infra</strong><span>任务控制台 · v1</span></div><p id="identity">未连接</p></header>
<main><section aria-labelledby="connect-heading"><h1 id="connect-heading">连接工作空间</h1><form id="connect"><label>访问令牌<input id="token" type="password" autocomplete="off" required minlength="24"></label><button>连接</button><button id="disconnect" type="button">断开</button></form><p>令牌仅保存在当前页面内存。关闭或刷新页面后需重新输入。</p></section>
<p id="notice" role="status" aria-live="polite">请连接后选择 Agent。</p>
<div class="columns"><section><h2>新建任务</h2><form id="submit"><label>Agent 版本<select id="agent" required></select></label><label>执行池<select id="pool" required></select></label><label>任务目标<textarea id="prompt" maxlength="4096" rows="5" placeholder="描述要分析的内容或生成的结果"></textarea></label><div class="columns"><label>时限（秒）<input id="timeout" type="number" min="10" max="600" value="180" required></label><label>Token 额度<input id="budget" type="number" min="1024" max="100000" value="16000" required></label></div><p>工具在独立沙箱运行；当前策略不允许外网或宿主目录。Token 额度不等于硬货币预算。</p><button id="submit-button">提交任务</button></form></section>
<section><div class="title"><h2>最近任务</h2><button id="refresh" type="button">刷新</button></div><ul id="tasks"></ul></section></div>
<section id="detail" hidden><div class="title"><h2 id="task-title">任务详情</h2><div><button id="cancel" type="button">申请取消</button><button id="download" type="button">下载结果</button></div></div><p id="status"></p><p id="usage"></p><pre id="result"></pre><h3>事件</h3><pre id="events"></pre><form id="review" hidden><h3>管理员核对</h3><label>核对证据<textarea id="evidence" minlength="10" maxlength="2000" required></textarea></label><label>结论<select id="outcome"><option value="failed">失败</option><option value="cancelled">已取消</option><option value="succeeded">成功</option></select></label><label><input id="confirmed" type="checkbox" required>已核实执行停止、宿主资源回收及副作用；证据可追溯</label><button>提交核对</button></form></section>
<section id="admin" hidden><h2>节点管理</h2><p>节点注册通过部署初始化命令完成。排空仅停止领取新任务，吊销会拒绝后续节点请求。</p><ul id="nodes"></ul></section>
</main><footer>正式模块首轮实现 · Demo 明确模拟 · 真实执行与容量仍需验收</footer></body></html>
