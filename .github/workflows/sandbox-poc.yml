name: Sandbox PoC checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r poc/sandbox/requirements.txt
      - run: python -m unittest discover -s poc/sandbox -p 'test_*.py' -v
      - run: python poc/sandbox/probe.py --help
