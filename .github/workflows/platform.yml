name: Formal platform checks
on: [push, pull_request]
jobs:
  postgres-contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: agent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d agent_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r control-plane/requirements.txt -r runner/requirements.txt
      - name: PostgreSQL state, authorization and Runner tests
        env:
          PYTHONPATH: control-plane:.
          TEST_DATABASE_URL: postgresql://test:test-only-password@localhost:5432/agent_test
        run: python -m unittest discover -s tests/acceptance -p 'test_*.py' -v
      - run: node --check web/app.js && node --check web/v2.js
      - name: Contract snapshot stays in sync
        env:
          PYTHONPATH: control-plane:.
        run: |
          python -m contracts.export
          python -m contracts.export_v2
          python -m contracts.export_v3
          git diff --exit-code -- contracts/openapi-v1.json contracts/openapi-v2.json contracts/openapi-internal-v2.json contracts/openapi-v3.json

  temporal-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r control-plane/requirements.txt
      - name: Real Temporal workflow, activity retry and history replay
        env:
          PYTHONPATH: control-plane:.
          TEST_TEMPORAL: '1'
        run: python -m unittest discover -s tests/acceptance -p test_temporal_integration.py -v

  pi-image-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: runtime/pi-agent/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: runtime/pi-agent
      - run: npm test
        working-directory: runtime/pi-agent
