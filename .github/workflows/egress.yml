name: Controlled egress kernel checks
on:
  pull_request:
  push:
    branches: [main, 'feat/controlled-egress']
permissions:
  contents: read
jobs:
  network-namespace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install kernel network tooling
        run: sudo apt-get update && sudo apt-get install -y nftables iproute2
      - name: Verify real namespace default deny and proxy-only routing
        run: sudo env PYTHONPATH=. python3 tests/acceptance/egress_kernel.py
