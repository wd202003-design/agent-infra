name: Development task loop
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r devserver/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_devserver.py' -v
      - run: node --check devserver/static/ui.js
